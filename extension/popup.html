<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      padding: 20px 18px 18px;
      width: 300px;
      background: #0d0d1a;
      color: #fff;
      margin: 0;
    }
    h2 {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 6px;
      letter-spacing: 0.02em;
    }
    .mode {
      font-size: 11px;
      color: #94a3b8;
      margin: 0 0 14px;
      line-height: 1.45;
    }
    .dot {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #444;
      margin-right: 8px;
      vertical-align: middle;
    }
    .dot.on  { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
    .dot.off { background: #ef4444; box-shadow: 0 0 6px #ef4444; }
    #status { font-size: 13px; font-weight: 600; vertical-align: middle; }
    #count  { font-size: 12px; color: #cbd5e1; margin: 8px 0 14px; }
    #project {
      font-size: 11px;
      color: #cbd5e1;
      margin: 0 0 12px;
      padding: 8px 10px;
      background: #14141f;
      border-radius: 6px;
      border: 1px solid #2a2a3a;
      line-height: 1.45;
    }
    button {
      display: block;
      margin-top: 10px;
      width: 100%;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      background: transparent;
      border-radius: 6px;
      letter-spacing: 0.01em;
    }
    button:disabled { opacity: 0.25 !important; cursor: default; box-shadow: none !important; }
    #copy-btn {
      border: 1.5px solid #38bdf8;
      box-shadow: 0 0 10px #38bdf880, inset 0 0 10px #38bdf820;
    }
    #copy-btn.copied {
      border-color: #22c55e;
      box-shadow: 0 0 10px #22c55e80, inset 0 0 10px #22c55e20;
    }
    #clear-btn {
      border: 1.5px solid #f87171;
      box-shadow: 0 0 10px #f8717180, inset 0 0 10px #f8717120;
    }
    #hint {
      font-size: 10px;
      color: #94a3b8;
      margin: 12px 0 0;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h2>VisBug Bridge</h2>
  <p class="mode">Запись в буфер · <span id="ext-version">v…</span><br>Правки в код вносит Cursor вручную.</p>
  <div>
    <span class="dot" id="dot"></span>
    <span id="status">Подключение…</span>
  </div>
  <p id="count">Правок в буфере: 0</p>
  <div id="project">Проверяю проект…</div>
  <button id="copy-btn" disabled>Скопировать правки</button>
  <button id="clear-btn" disabled>Очистить правки</button>
  <p id="hint">Откройте VisBug на странице, двигайте элементы, затем «Скопировать» и вставьте текст в чат Cursor.</p>
  <script src="popup.js"></script>
</body>
</html>
