<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    html, body {
      min-height: 490px;
    }
    body {
      font-family: system-ui, sans-serif;
      padding: 18px 16px 16px;
      width: 380px;
      min-height: 490px;
      background: #0d0d1a;
      color: #fff;
      margin: 0;
    }
    h2 {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 6px;
      letter-spacing: 0.02em;
    }
    .mode {
      font-size: 11px;
      color: #38bdf8;
      margin: 0 0 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .status-row {
      margin-bottom: 6px;
    }
    .dot {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #444;
      margin-right: 8px;
      vertical-align: middle;
    }
    .dot.on  { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
    .dot.off { background: #ef4444; box-shadow: 0 0 6px #ef4444; }
    .dot.rec { background: #f59e0b; box-shadow: 0 0 6px #f59e0b; animation: pulse 1.2s infinite; }
    @keyframes pulse { 50% { opacity: 0.5; } }
    #status { font-size: 13px; font-weight: 600; vertical-align: middle; }
    #count {
      font-size: 13px;
      color: #cbd5e1;
      margin: 0 0 14px;
      font-weight: 500;
    }
    #hint {
      display: none;
      font-size: 11px;
      color: #888;
      margin: 0 0 10px;
      line-height: 1.45;
    }
    #hint.show { display: block; }
    #update-banner {
      display: none;
      font-size: 11px;
      color: #fde68a;
      margin: 0 0 10px;
      padding: 8px 10px;
      background: #1c1910;
      border: 1px solid #b45309;
      border-radius: 6px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #update-banner.show { display: block; }
    #update-banner strong { color: #fbbf24; }
    #health {
      font-size: 11px;
      padding: 8px 10px;
      background: #14141f;
      border-radius: 6px;
      border: 1px solid #2a2a3a;
      margin: 14px 0 10px;
      line-height: 1.55;
    }
    #health .ok { color: #22c55e; }
    #health .bad { color: #f87171; }
    #health .opt { color: #94a3b8; }
    #project {
      font-size: 11px;
      color: #cbd5e1;
      margin: 0 0 10px;
      padding: 8px 10px;
      background: #14141f;
      border-radius: 6px;
      border: 1px solid #2a2a3a;
      line-height: 1.45;
    }
    #pipeline {
      display: none;
      font-size: 11px;
      color: #fde68a;
      margin: 0 0 10px;
      padding: 8px 10px;
      background: #1c1910;
      border: 1px solid #b45309;
      border-radius: 6px;
      line-height: 1.45;
      white-space: pre-wrap;
      max-height: 160px;
      overflow: auto;
    }
    #pipeline.show { display: block; }
    #install-hint {
      font-size: 10px;
      color: #94a3b8;
      margin: 0;
      padding: 8px 10px;
      background: #14141f;
      border-radius: 6px;
      border: 1px solid #2a2a3a;
      line-height: 1.5;
      word-break: break-all;
    }
    #install-hint a { color: #38bdf8; }
    #install-hint code { color: #e2e8f0; font-size: 10px; }
    .actions { margin-bottom: 4px; }
    button {
      display: block;
      margin-top: 8px;
      width: 100%;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      background: transparent;
      border-radius: 6px;
      letter-spacing: 0.01em;
    }
    button:disabled { opacity: 0.25 !important; cursor: default; box-shadow: none !important; }
    #record-btn {
      border: 1.5px solid #f59e0b;
      box-shadow: 0 0 10px #f59e0b80, inset 0 0 10px #f59e0b20;
    }
    #record-btn.recording {
      border-color: #ef4444;
      box-shadow: 0 0 10px #ef444480, inset 0 0 10px #ef444420;
    }
    #copy-btn {
      border: 1.5px solid #38bdf8;
      box-shadow: 0 0 10px #38bdf880, inset 0 0 10px #38bdf820;
    }
    #copy-btn.copied {
      border-color: #22c55e;
      box-shadow: 0 0 10px #22c55e80, inset 0 0 10px #22c55e20;
    }
    #clear-btn {
      border: 1.5px solid #f87171;
      box-shadow: 0 0 10px #f8717180, inset 0 0 10px #f8717120;
    }
  </style>
</head>
<body>
  <h2>VisBug Bridge</h2>
  <p class="mode">Запись → файлы → Cursor Agent при необходимости · <span id="ext-version">v…</span></p>

  <div class="status-row">
    <span class="dot" id="dot"></span>
    <span id="status">Подключение…</span>
  </div>
  <p id="hint"></p>
  <div id="update-banner" role="status"></div>
  <p id="count">Правок текущей записи: 0</p>
  <div id="project">Проверяю текущую страницу и проект…</div>
  <div id="pipeline" role="status"></div>

  <div class="actions">
    <button id="record-btn" disabled>Начать запись</button>
    <button id="copy-btn" disabled>Скопировать правки</button>
    <button id="clear-btn" disabled>Очистить правки</button>
  </div>

  <div id="health">Проверка Bridge…</div>
  <div id="install-hint">Загрузка путей установки…</div>
  <script src="popup.js"></script>
</body>
</html>
