<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      padding: 20px 18px 18px;
      width: 300px;
      background: #0d0d1a;
      color: #fff;
      margin: 0;
    }
    h2 {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 8px;
      letter-spacing: 0.02em;
    }
    .mode {
      font-size: 11px;
      color: #38bdf8;
      margin: 0 0 14px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .dot {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #444;
      margin-right: 8px;
      vertical-align: middle;
    }
    .dot.on  { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
    .dot.off { background: #ef4444; box-shadow: 0 0 6px #ef4444; }
    .dot.rec { background: #f59e0b; box-shadow: 0 0 6px #f59e0b; animation: pulse 1.2s infinite; }
    @keyframes pulse { 50% { opacity: 0.5; } }
    #status { font-size: 13px; font-weight: 600; vertical-align: middle; }
    #hint, #count { font-size: 12px; color: #888; margin: 8px 0 12px; line-height: 1.45; }
    button {
      display: block;
      margin-top: 10px;
      width: 100%;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      background: transparent;
      border-radius: 6px;
      letter-spacing: 0.01em;
    }
    button:disabled { opacity: 0.25 !important; cursor: default; box-shadow: none !important; }
    #record-btn {
      border: 1.5px solid #f59e0b;
      box-shadow: 0 0 10px #f59e0b80, inset 0 0 10px #f59e0b20;
    }
    #record-btn.recording {
      border-color: #ef4444;
      box-shadow: 0 0 10px #ef444480, inset 0 0 10px #ef444420;
    }
    #copy-btn {
      border: 1.5px solid #38bdf8;
      box-shadow: 0 0 10px #38bdf880, inset 0 0 10px #38bdf820;
    }
    #copy-btn.copied {
      border-color: #22c55e;
      box-shadow: 0 0 10px #22c55e80, inset 0 0 10px #22c55e20;
    }
    #clear-btn {
      border: 1.5px solid #f87171;
      box-shadow: 0 0 10px #f8717180, inset 0 0 10px #f8717120;
    }
  </style>
</head>
<body>
  <h2>VisBug MCP Bridge</h2>
  <p class="mode">Режим: запись (snapshot)</p>
  <div>
    <span class="dot" id="dot"></span>
    <span id="status">Подключение…</span>
  </div>
  <p id="hint">Снимается вся главная (#homepage-root). Начать → правки в VisBug → Стоп → Скопировать / MCP</p>
  <p id="count"></p>
  <button id="record-btn" disabled>Начать запись</button>
  <button id="copy-btn" disabled>Скопировать правки</button>
  <button id="clear-btn" disabled>Очистить правки</button>
  <script src="popup.js"></script>
</body>
</html>
